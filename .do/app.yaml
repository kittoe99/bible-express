name: bible-express
region: nyc
services:
  - name: web
    github:
      repo: kittoe99/bible-express
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /
