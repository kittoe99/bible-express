name: bible-express
region: nyc
services:
  - name: web
    # Prefer GitHub integration when connected in DO:
    # github:
    #   repo: kittoe99/bible-express
    #   branch: main
    #   deploy_on_push: true
    git:
      repo_clone_url: https://github.com/kittoe99/bible-express.git
      branch: main
    dockerfile_path: Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /
